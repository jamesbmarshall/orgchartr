services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      # Data (JSON + photos) is bind-mounted so edits land directly on your git-tracked files.
      - ./data:/app/data
      # The .git directory is bind-mounted (read-write) so the in-app "Commit changes" /
      # "Push" actions operate on your real local repo.
      - ./.git:/app/.git
    environment:
      # Identity used for commits made via the app's "Commit changes" button.
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-orgchartr}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-orgchartr@localhost}
    restart: unless-stopped
