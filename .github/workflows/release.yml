name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          npm run version:check
          version="${RELEASE_TAG#v}"
          major_minor="${version%.*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"

      - name: Lint frontend
        run: npm run lint -w frontend

      - name: Build and type-check workspaces
        run: npm run build

      - name: Verify local-only production bundle
        run: npm run verify:local-bundle

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build and smoke-test release container
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f docker-compose.yml -f docker-compose.build.yml)
          "${compose[@]}" up -d --build
          trap '"${compose[@]}" down' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              "${compose[@]}" logs
              exit 1
            fi
            sleep 1
          done

          headers="$(mktemp)"
          curl --fail --silent --dump-header "$headers" http://127.0.0.1:3000/ >/dev/null
          grep --ignore-case --quiet '^content-security-policy:' "$headers"
          grep --ignore-case --quiet '^x-content-type-options: nosniff' "$headers"
          grep --ignore-case --quiet '^x-frame-options: DENY' "$headers"
          grep --ignore-case --quiet '^cache-control: no-store' "$headers"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/health)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/photos/test.png)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/unknown)" = 404
          test "$(curl --silent --request POST --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/)" = 403

          container_id="$("${compose[@]}" ps --quiet app)"
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = '101:101'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_id")" = 'true'
          test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$container_id")" = '["ALL"]'
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$container_id" | grep --quiet 'no-new-privileges:true'
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$container_id")" = '64'
          test "$(docker inspect --format '{{json .HostConfig.Binds}}' "$container_id")" = 'null'

          image_id="$("${compose[@]}" images --quiet app)"
          docker tag "$image_id" orgchartr-release:validation

      - name: Scan release container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: orgchartr-release:validation
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major_minor }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Generate published image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" sbom.cdx.json --clobber
          else
            gh release create "$RELEASE_TAG" sbom.cdx.json \
              --verify-tag \
              --prerelease \
              --generate-notes \
              --title "orgchartr $RELEASE_TAG"
          fi