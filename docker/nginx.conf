server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/orgchartr-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location = /index.html {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/orgchartr-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /assets/ {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/orgchartr-security-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.svg {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/orgchartr-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /icons.svg {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/orgchartr-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /api {
        include /etc/nginx/snippets/orgchartr-security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/orgchartr-security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location = /photos {
        include /etc/nginx/snippets/orgchartr-security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location ^~ /photos/ {
        include /etc/nginx/snippets/orgchartr-security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location / {
        include /etc/nginx/snippets/orgchartr-security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
